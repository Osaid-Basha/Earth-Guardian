<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePath Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-primary {
            @apply bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 shadow-lg hover:shadow-xl active:scale-95;
        }
        .card {
            @apply bg-white rounded-2xl shadow-lg p-6 border border-gray-100;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="flex items-center justify-center min-h-screen">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl p-8 text-center">
            <h1 class="text-3xl font-bold text-blue-600 mb-4">
                SafePath
            </h1>
            <p class="text-gray-600 mb-6">
                Disaster Management App
            </p>
            <div class="space-y-4">
                <div class="bg-blue-100 p-4 rounded-lg">
                    <h3 class="font-semibold text-blue-800">Home Screen</h3>
                    <p class="text-sm text-blue-600">Interactive map with risk zones</p>
                </div>
                <div class="bg-green-100 p-4 rounded-lg">
                    <h3 class="font-semibold text-green-800">Safe Zones</h3>
                    <p class="text-sm text-green-600">Shelter database and navigation</p>
                </div>
                <div class="bg-orange-100 p-4 rounded-lg">
                    <h3 class="font-semibold text-orange-800">Education</h3>
                    <p class="text-sm text-orange-600">Disaster preparedness tips</p>
                </div>
            </div>
            <button class="btn-primary mt-6">
                Test Button
            </button>
            <div class="mt-6 text-sm text-gray-500">
                If you can see this styled page, Tailwind CSS is working! 🎉
            </div>
        </div>
    </div>
</body>
</html>
