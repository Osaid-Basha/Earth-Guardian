<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PronHun - Pronunciation Helper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .text-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1.1em;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            text-align: left;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .control-group select,
        .control-group input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-value {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            min-width: 40px;
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e1e5e9;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .history-section {
            text-align: left;
            margin-top: 30px;
        }

        .history-title {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 10px;
        }

        .history-item {
            padding: 8px 12px;
            margin-bottom: 5px;
            background: #f8f9fa;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background: #e9ecef;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-text {
            flex: 1;
        }

        .history-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 0.8em;
            min-width: auto;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 PronHun</h1>
            <p>Your AI-powered pronunciation assistant</p>
        </div>

        <div class="input-section">
            <input type="text" id="textInput" class="text-input" placeholder="Enter text to pronounce..." />
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="voiceSelect">Voice:</label>
                <select id="voiceSelect">
                    <option value="">Select a voice...</option>
                </select>
            </div>
            <div class="control-group">
                <label for="speedRange">Speed:</label>
                <div class="range-container">
                    <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1">
                    <span class="range-value" id="speedValue">1.0</span>
                </div>
            </div>
            <div class="control-group">
                <label for="pitchRange">Pitch:</label>
                <div class="range-container">
                    <input type="range" id="pitchRange" min="0.5" max="2" step="0.1" value="1">
                    <span class="range-value" id="pitchValue">1.0</span>
                </div>
            </div>
            <div class="control-group">
                <label for="volumeRange">Volume:</label>
                <div class="range-container">
                    <input type="range" id="volumeRange" min="0" max="1" step="0.1" value="0.8">
                    <span class="range-value" id="volumeValue">0.8</span>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button id="speakBtn" class="btn btn-primary">🔊 Speak</button>
            <button id="pauseBtn" class="btn btn-secondary" disabled>⏸️ Pause</button>
            <button id="stopBtn" class="btn btn-secondary" disabled>⏹️ Stop</button>
            <button id="clearBtn" class="btn btn-secondary">🗑️ Clear</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="history-section">
            <h3 class="history-title">📚 Pronunciation History</h3>
            <div id="historyList" class="history-list">
                <p style="text-align: center; color: #666; padding: 20px;">No pronunciation history yet</p>
            </div>
        </div>
    </div>

    <script>
        class PronHun {
            constructor() {
                this.synth = window.speechSynthesis;
                this.utterance = null;
                this.isPlaying = false;
                this.history = JSON.parse(localStorage.getItem('pronhun-history') || '[]');
                
                this.initializeElements();
                this.loadVoices();
                this.setupEventListeners();
                this.updateHistoryDisplay();
            }

            initializeElements() {
                this.textInput = document.getElementById('textInput');
                this.voiceSelect = document.getElementById('voiceSelect');
                this.speedRange = document.getElementById('speedRange');
                this.pitchRange = document.getElementById('pitchRange');
                this.volumeRange = document.getElementById('volumeRange');
                this.speedValue = document.getElementById('speedValue');
                this.pitchValue = document.getElementById('pitchValue');
                this.volumeValue = document.getElementById('volumeValue');
                this.speakBtn = document.getElementById('speakBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.status = document.getElementById('status');
                this.historyList = document.getElementById('historyList');
            }

            loadVoices() {
                const loadVoices = () => {
                    const voices = this.synth.getVoices();
                    this.voiceSelect.innerHTML = '<option value="">Select a voice...</option>';
                    
                    voices.forEach((voice, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = `${voice.name} (${voice.lang})`;
                        this.voiceSelect.appendChild(option);
                    });
                };

                // Load voices immediately and when they change
                loadVoices();
                this.synth.onvoiceschanged = loadVoices;
            }

            setupEventListeners() {
                // Range inputs
                this.speedRange.addEventListener('input', () => {
                    this.speedValue.textContent = this.speedRange.value;
                });

                this.pitchRange.addEventListener('input', () => {
                    this.pitchValue.textContent = this.pitchRange.value;
                });

                this.volumeRange.addEventListener('input', () => {
                    this.volumeValue.textContent = this.volumeRange.value;
                });

                // Buttons
                this.speakBtn.addEventListener('click', () => this.speak());
                this.pauseBtn.addEventListener('click', () => this.pause());
                this.stopBtn.addEventListener('click', () => this.stop());
                this.clearBtn.addEventListener('click', () => this.clear());

                // Enter key to speak
                this.textInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.speak();
                    }
                });
            }

            speak() {
                const text = this.textInput.value.trim();
                if (!text) {
                    this.showStatus('Please enter some text to pronounce', 'error');
                    return;
                }

                // Stop any current speech
                this.synth.cancel();

                // Create new utterance
                this.utterance = new SpeechSynthesisUtterance(text);
                
                // Set voice
                const selectedVoiceIndex = this.voiceSelect.value;
                if (selectedVoiceIndex) {
                    const voices = this.synth.getVoices();
                    this.utterance.voice = voices[selectedVoiceIndex];
                }

                // Set speech parameters
                this.utterance.rate = parseFloat(this.speedRange.value);
                this.utterance.pitch = parseFloat(this.pitchRange.value);
                this.utterance.volume = parseFloat(this.volumeRange.value);

                // Event handlers
                this.utterance.onstart = () => {
                    this.isPlaying = true;
                    this.updateButtonStates();
                    this.showStatus('Speaking...', 'info');
                };

                this.utterance.onend = () => {
                    this.isPlaying = false;
                    this.updateButtonStates();
                    this.showStatus('Finished speaking', 'success');
                    this.addToHistory(text);
                };

                this.utterance.onerror = (event) => {
                    this.isPlaying = false;
                    this.updateButtonStates();
                    this.showStatus(`Error: ${event.error}`, 'error');
                };

                // Speak
                this.synth.speak(this.utterance);
            }

            pause() {
                if (this.isPlaying) {
                    this.synth.pause();
                    this.isPlaying = false;
                    this.updateButtonStates();
                    this.showStatus('Paused', 'info');
                }
            }

            stop() {
                this.synth.cancel();
                this.isPlaying = false;
                this.updateButtonStates();
                this.showStatus('Stopped', 'info');
            }

            clear() {
                this.textInput.value = '';
                this.synth.cancel();
                this.isPlaying = false;
                this.updateButtonStates();
                this.hideStatus();
            }

            updateButtonStates() {
                this.speakBtn.disabled = this.isPlaying;
                this.pauseBtn.disabled = !this.isPlaying;
                this.stopBtn.disabled = !this.isPlaying;
            }

            showStatus(message, type) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
                this.status.style.display = 'block';
                
                // Auto-hide success messages
                if (type === 'success') {
                    setTimeout(() => this.hideStatus(), 3000);
                }
            }

            hideStatus() {
                this.status.style.display = 'none';
            }

            addToHistory(text) {
                // Remove if already exists
                this.history = this.history.filter(item => item !== text);
                // Add to beginning
                this.history.unshift(text);
                // Keep only last 20 items
                this.history = this.history.slice(0, 20);
                
                // Save to localStorage
                localStorage.setItem('pronhun-history', JSON.stringify(this.history));
                
                // Update display
                this.updateHistoryDisplay();
            }

            updateHistoryDisplay() {
                if (this.history.length === 0) {
                    this.historyList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No pronunciation history yet</p>';
                    return;
                }

                this.historyList.innerHTML = this.history.map(text => `
                    <div class="history-item">
                        <span class="history-text">${text}</span>
                        <div class="history-actions">
                            <button class="btn btn-small why btn-primary" onclick="pronHun.speakFromHistory('${text.replace(/'/g, "\\'")}')">🔊</button>
                            <button class="btn btn-small btn-secondary" onclick="pronHun.removeFromHistory('${text.replace(/'/g, "\\'")}')">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }

            speakFromHistory(text) {
                this.textInput.value = text;
                this.speak();
            }

            removeFromHistory(text) {
                this.history = this.history.filter(item => item !== text);
                localStorage.setItem('pronhun-history', JSON.stringify(this.history));
                this.updateHistoryDisplay();
            }
        }

        // Initialize the app
        let pronHun;
        document.addEventListener('DOMContentLoaded', () => {
            pronHun = new PronHun();
        });
    </script>
</body>
</html>
